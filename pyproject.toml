[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lacewing-isfet-lamp-quantification"
version = "1.0.0"
description = "ML for amplification onset detection on the Lacewing ISFET-LAMP diagnostic platform"
authors = [{name = "Jia Yi Huang"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/jiayihuang1/lacewing-isfet-lamp-quantification"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lacewing*"]
